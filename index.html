<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food hygiene ratings across the UK, as they stand</title>
    <meta
      name="description"
      content="Every food business the Food Standards Agency has rated, grouped by local authority and rating, with the distributions drawn live. Built with Lattice Grid loaded by script tag, with no install and no build."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet, from the Lattice Grid CDN. Every address on this
      page names the exact release and carries a cache stamp, so the page can
      never quietly pick up a different build than the one it was checked
      against.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.latticegrid.dev/lattice-grid@1.123.3/lattice-grid.min.css?v=1123003"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>Food hygiene ratings across the UK, as they stand</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.123.3/lattice-grid.min.js?v=1123003"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.123.3/modules/charts.min.js?v=1123003"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.123.3/modules/data-router.min.js?v=1123003"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.123.3/modules/kpi.min.js?v=1123003"
    ></script>
    <script
      src="https://cdn.latticegrid.dev/lattice-grid@1.123.3/modules/tabs.min.js?v=1123003"
    ></script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/fsa-feed.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
